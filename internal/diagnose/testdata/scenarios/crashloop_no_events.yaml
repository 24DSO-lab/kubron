# Событий нет вовсе (их могли вытеснить) и лога нет: диагностика опирается на состояние контейнера и не выдаёт
# отсутствие событий за отсутствие проблемы.
kind: Expect
target: {kind: Pod, namespace: shop, name: api-1}
symptoms: [pod.crash_loop]
hypotheses: ["crash.application_error:medium"]
absent: [crash.liveness_probe_failed]
recommendations: [rec.fix_application_error]
---
apiVersion: v1
kind: Pod
metadata: {name: api-1, namespace: shop, uid: p9}
spec: {nodeName: n1, containers: [{name: app, image: "app:2"}]}
status:
  phase: Running
  conditions: [{type: Ready, status: "False"}]
  containerStatuses:
    - name: app
      ready: false
      restartCount: 7
      state: {waiting: {reason: CrashLoopBackOff}}
      lastState: {terminated: {exitCode: 1, reason: Error, finishedAt: "2026-11-11T09:58:00Z"}}
