kind: Expect
target: {kind: Pod, namespace: shop, name: api-1}
symptoms: [pod.oom_killed]
hypotheses: ["oom.node_memory_pressure:medium", "oom.memory_growth:low"]
absent: [oom.limit_too_low]
---
apiVersion: v1
kind: Pod
metadata: {name: api-1, namespace: shop}
spec: {nodeName: n1, containers: [{name: app, image: "app:2"}]}
status:
  phase: Running
  conditions: [{type: Ready, status: "False"}]
  containerStatuses:
    - name: app
      restartCount: 1
      state: {terminated: {exitCode: 137, reason: OOMKilled}}
---
apiVersion: v1
kind: Node
metadata: {name: n1}
status: {conditions: [{type: MemoryPressure, status: "True"}]}
