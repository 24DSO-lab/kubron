apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: app, uid: s1}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-1, namespace: app, uid: p-web-1, labels: {app: other}}
spec:
  containers: [{name: web, image: example/web, ports: [{name: http, containerPort: 8080}]}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
  containerStatuses:
    - {name: web, ready: true, restartCount: 0, state: {running: {startedAt: "2026-11-11T09:00:00Z"}}}
