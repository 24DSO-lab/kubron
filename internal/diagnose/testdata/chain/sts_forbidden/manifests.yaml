apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: app, uid: s1}
spec:
  replicas: 3
  serviceName: db
  selector: {matchLabels: {app: db}}
  volumeClaimTemplates: [{metadata: {name: data}}]

status: {replicas: 3, readyReplicas: 1}
---
apiVersion: v1
kind: Node
metadata: {name: n1}
status: {conditions: [{type: Ready, status: "True"}]}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: fast}
provisioner: example/csi
