apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: site, namespace: app, uid: i1}
spec:
  ingressClassName: gone
  tls: [{hosts: [site.example.test], secretName: site-tls}]
  rules:
    - host: site.example.test
      http:
        paths:
          - {path: /0, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: app, uid: s1}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-1, namespace: app, uid: p1, labels: {app: web}}
spec:
  containers: [{name: web, image: example/web, ports: [{name: http, containerPort: 8080}]}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
  containerStatuses:
    - {name: web, ready: true, restartCount: 0, state: {running: {startedAt: "2026-11-11T09:00:00Z"}}}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: web-abc, namespace: app, uid: es1, labels: {kubernetes.io/service-name: web}}
addressType: IPv4
endpoints:
  - {addresses: ["10.0.0.5"], conditions: {ready: true}}
