apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: v1
kind: Pod
metadata: {name: web-0, namespace: app, uid: p1, labels: {app: web}}
spec:
  containers:
    - name: web
      image: example/web
      envFrom: [{configMapRef: {name: app-optional, optional: true}}]
status:
  phase: Running
  conditions: [{type: PodScheduled, status: "True"}, {type: Ready, status: "False"}]
  containerStatuses: [{name: web, ready: false, restartCount: 0, state: {running: {startedAt: "2026-11-11T09:00:00Z"}}}]
