apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: site, namespace: app, uid: i1}
spec:
  ingressClassName: nginx
  defaultBackend: {resource: {apiGroup: example.io, kind: Bucket, name: static}}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: nginx}
spec: {controller: k8s.io/ingress-nginx}
