apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: app, uid: hpa-1}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 5
status:
  currentReplicas: 0
  desiredReplicas: 0
  conditions:
    - {type: ScalingActive, status: "False", reason: ScalingDisabled}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: app, uid: d1, generation: 1}
spec: {replicas: 0, selector: {matchLabels: {app: web}}}
status: {observedGeneration: 1, replicas: 0}
