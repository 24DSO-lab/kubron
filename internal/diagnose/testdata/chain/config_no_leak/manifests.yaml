apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: v1
kind: Pod
metadata: {name: web-0, namespace: app, uid: p1, labels: {app: web}}
spec:
  containers:
    - name: web
      image: example/web
      envFrom: [{configMapRef: {name: app-env}}]
status:
  phase: Pending
  conditions: [{type: PodScheduled, status: "True"}, {type: Ready, status: "False"}]
  containerStatuses:
    - name: web
      ready: false
      restartCount: 0
      state: {waiting: {reason: CreateContainerConfigError, message: "couldn't find key TOKEN in ConfigMap app/app-env"}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
  namespace: app
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"data":{"TOKEN":"LEAK-LAST-APPLIED"}}'
data:
  TOKEN: LEAK-DATA-TOKEN
  config.yaml: "password: LEAK-DATA-PASSWORD"
binaryData:
  blob: TEVBSy1CSU5BUlk=
