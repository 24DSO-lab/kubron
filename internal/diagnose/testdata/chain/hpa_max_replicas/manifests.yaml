apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: app, uid: d1, generation: 1}
spec: {replicas: 2, selector: {matchLabels: {app: web}}}
status: {observedGeneration: 1, updatedReplicas: 2, availableReplicas: 2, readyReplicas: 2, replicas: 2}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-7d
  namespace: app
  uid: r1
  labels: {app: web, pod-template-hash: 7d}
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: web, uid: d1, controller: true}]
spec: {replicas: 2, selector: {matchLabels: {app: web, pod-template-hash: 7d}}}
status: {replicas: 2, readyReplicas: 2}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-7d-a
  namespace: app
  uid: p1
  labels: {app: web, pod-template-hash: 7d}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-7d, uid: r1, controller: true}]
spec: {containers: [{name: app, image: example/app}]}
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: app, uid: hpa-1}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 5
status:
  currentReplicas: 5
  desiredReplicas: 5
  conditions:
    - {type: AbleToScale, status: "True", reason: ReadyForNewScale}
    - {type: ScalingActive, status: "True", reason: ValidMetricFound}
    - {type: ScalingLimited, status: "True", reason: TooManyReplicas}
