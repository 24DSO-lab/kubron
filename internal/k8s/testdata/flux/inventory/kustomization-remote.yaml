apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: remote
  namespace: flux-system
spec:
  interval: 10m
  path: ./remote
  kubeConfig:
    secretRef:
      name: remote-kubeconfig
  sourceRef:
    kind: GitRepository
    name: fleet
status:
  conditions:
    - type: Ready
      status: "True"
  inventory:
    entries:
      - id: prod_web_apps_Deployment
        v: v1
