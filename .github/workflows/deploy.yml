name: Deploy (image and Helm chart)

# Образ сервера и Helm-чарт (docs/deploy.md). Отдельный workflow: ci.yml разработчики этапа 3 правят
# параллельно. Образ собирается, но не публикуется (push в реестр — отдельная задача релиза).
on:
  push:

    branches: [master, dev, refactor]

    paths: &paths
      - Dockerfile
      - .dockerignore
      - .hadolint.yaml
      - deploy/**
      - scripts/check-chart.sh
      - scripts/check-ignores.py
      - scripts/chart-sbom.py
      - .trivyignore
      - .github/workflows/deploy.yml
      - go.mod
      - go.sum
      - cmd/kubron-server/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vite.config.ts
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# Новый push в PR отменяет прежний прогон; прогоны веток не отменяются
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Версии и контрольные суммы инструментов, которых нет на runner'е: скачанный бинарник проверяется по SHA-256
  HADOLINT_VERSION: v2.12.0
  HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  # Версия Kubernetes, по схемам которой kubeconform проверяет манифесты чарта
  K8S_SCHEMA_VERSION: 1.31.0

jobs:
  # Содержимое уже проходило этот workflow целиком (тот же tree hash: merge-коммит PR, коммит после слияния,
  # повышение ветки): сборка образа и проверки чарта дадут тот же результат, их не повторяем. Тег и ручной запуск
  # пропуск не используют. Подробности: .github/actions/verified-tree.
  tree:
    name: Tree already verified?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.verified.outputs.tree }}
      verified: ${{ steps.verified.outputs.verified }}
      record: ${{ steps.verified.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verified
        uses: ./.github/actions/verified-tree
        with:
          prefix: deploy
          token: ${{ github.token }}

  hadolint:
    name: Dockerfile (hadolint)
    needs: tree
    if: ${{ !cancelled() && needs.tree.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
      - run: '"$RUNNER_TEMP/hadolint" --config .hadolint.yaml Dockerfile'

  # helm lint, helm template по всем наборам values из ci/, схемы Kubernetes и смысловые проверки
  chart:
    name: Helm chart (lint, template, kubeconform)
    needs: tree
    if: ${{ !cancelled() && needs.tree.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: helm version
      - run: scripts/check-chart.sh

      # Конфигурация чарта: отчёт по всем наборам values (не ворота). Ворота образа — в publish.yml.
      - name: Render the chart for trivy config
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for f in deploy/helm/kubron/ci/*-values.yaml; do
            helm template kubron deploy/helm/kubron --namespace kubron -f "$f" > "$RUNNER_TEMP/rendered/$(basename "$f" .yaml).yaml"
          done
      - name: Trivy (chart misconfiguration report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/rendered
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore
          format: table

      - name: SBOM of the chart (script check)
        run: |
          python3 scripts/check-ignores.py
          python3 scripts/chart-sbom.py --chart deploy/helm/kubron --version 0.0.0-ci --image ghcr.io/example/kubron \
            --image-digest "sha256:$(printf '0%.0s' $(seq 64))" --chart-repo oci://ghcr.io/example/charts --out "$RUNNER_TEMP/chart.cdx.json"

  # Сборка образа без push, проверка под non-root с read-only rootfs, затем установка чарта в kind
  # с внешним PostgreSQL и существующим Secret.
  kind:
    name: Image build and kind install
    needs: tree
    if: ${{ !cancelled() && needs.tree.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image (no push)
        run: |
          set -o pipefail
          if ! docker build --progress=plain \
            --build-arg VERSION=ci --build-arg REVISION="${GITHUB_SHA}" \
            -t kubron:ci . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # хвост лога — в аннотацию: виден в интерфейсе проверки без скачивания логов
            echo "::error title=docker build failed::$(tail -n 25 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3500)"
            exit 1
          fi
          docker image ls kubron:ci

      - name: Image is non-root
        run: |
          user="$(docker image inspect kubron:ci --format '{{.Config.User}}')"
          echo "user=$user"
          test "$user" = "65532:65532"
          docker image inspect kubron:ci --format '{{json .Config.Entrypoint}} {{json .Config.ExposedPorts}}'

      # Отчёт об уязвимостях образа (HIGH/CRITICAL с исправлением). В PR только информирует; ворота перед push
      # образа — в publish.yml. Исключения: .trivyignore.
      - name: Trivy (image report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kubron:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore
          format: table

      # Без кластера и БД: файловое хранилище в HOME. Корневая ФС только для чтения, HOME и /tmp — tmpfs.
      # Первичная настройка пишет в каталог данных, то есть проверяет, что writable-каталоги достаточны.
      - name: Run read-only as non-root
        run: |
          docker run -d --name kubron-smoke --read-only \
            --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e KUBRON_ALLOW_REMOTE=1 -e KUBRON_SETUP_TOKEN=ci-setup-token-0123456789 \
            -p 127.0.0.1:18080:8080 kubron:ci
          ok=
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18080/healthz | grep -qx ok; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok" || { docker logs kubron-smoke; exit 1; }
          # встроена именно веб-сборка фронтенда
          curl -fs http://127.0.0.1:18080/ | grep -q 'name="kubron-target" content="web"'
          # В сервисном режиме без токена первичная настройка отклоняется, с токеном проходит
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '["smoke-admin","smoke-password-1"]' \
            http://127.0.0.1:18080/api/rpc/SetupAdmin)" = 403
          curl -fs -X POST -H 'Content-Type: application/json' -H 'X-Kubron-Setup-Token: ci-setup-token-0123456789' \
            -d '["smoke-admin","smoke-password-1"]' http://127.0.0.1:18080/api/rpc/SetupAdmin | grep -q smoke-admin
          docker logs kubron-smoke
          docker rm -f kubron-smoke

      - name: kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kubron-deploy

      - name: Load the image into kind
        run: kind load docker-image kubron:ci --name kubron-deploy

      - name: PostgreSQL and the Secret
        run: |
          kubectl apply -f deploy/helm/kubron/ci/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
          # Одноразовый ключ только для этого прогона. В реальной установке ключ создаёт и хранит человек (docs/deploy.md)
          key="ci1:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "KUBRON_CI_KEY=$key" >> "$GITHUB_ENV"
          kubectl create secret generic kubron-secrets \
            --from-literal=KUBRON_SECRET_KEY="$key" \
            --from-literal=KUBRON_DATABASE_URL='postgres://kubron:kubron@postgres:5432/kubron?sslmode=disable'

      - name: helm install
        run: |
          helm install kubron deploy/helm/kubron \
            -f deploy/helm/kubron/ci/minimal-values.yaml \
            --set image.repository=kubron --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Check the release
        run: |
          kubectl port-forward svc/kubron 18081:80 >"$RUNNER_TEMP/pf.log" 2>&1 &
          sleep 3
          curl -fs http://127.0.0.1:18081/healthz | grep -qx ok
          # Вход создаёт запись в PostgreSQL (миграции применены, БД доступна), а не в файлах пода
          # Токен создал чарт (Secret <release>-setup): без него SetupAdmin отклоняется
          token="$(kubectl get secret kubron-setup -o jsonpath='{.data.KUBRON_SETUP_TOKEN}' | base64 -d)"
          echo "::add-mask::$token"
          test "${#token}" -ge 32
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '["kind-admin","kind-password-1"]' http://127.0.0.1:18081/api/rpc/SetupAdmin)"
          test "$code" != 200
          curl -fs -X POST -H 'Content-Type: application/json' -H "X-Kubron-Setup-Token: $token" \
            -d '["kind-admin","kind-password-1"]' http://127.0.0.1:18081/api/rpc/SetupAdmin | grep -q kind-admin
          # Реплик две: миграции применяет та, что первой взяла блокировку, поэтому смотрим журналы всех подов
          kubectl logs -l app.kubernetes.io/name=kubron --tail=-1 --prefix | tee "$RUNNER_TEMP/kubron.log"
          grep -qE 'migrations applied|applied migrations' "$RUNNER_TEMP/kubron.log"
          # Ключ шифрования не попадает в логи
          ! grep -qF "${KUBRON_CI_KEY#*:}" "$RUNNER_TEMP/kubron.log"
          # Токен ServiceAccount не смонтирован (режим in-cluster выключен)
          test "$(kubectl get pod -l app.kubernetes.io/name=kubron -o jsonpath='{.items[0].spec.automountServiceAccountToken}')" = "false"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,networkpolicy,secret -o wide || true
          kubectl describe pod -l app.kubernetes.io/name=kubron || true
          kubectl logs deploy/kubron --all-containers --tail=200 || true
          kubectl logs deploy/postgres --tail=50 || true

  # Отметка «содержимое проверено»: после полностью зелёного прогона без пропусков (и только для push и PR из этого
  # репозитория) следующий прогон с тем же содержимым пропустит job'ы выше.
  record-verified:
    name: Record verified tree
    needs: [tree, hadolint, chart, kind]
    if: >-
      ${{ !cancelled() && needs.tree.outputs.verified != 'true' && needs.tree.outputs.record == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the marker
        env:
          TREE: ${{ needs.tree.outputs.tree }}
        run: |
          [[ $TREE =~ ^[0-9a-f]{40,64}$ ]] || { echo "unexpected tree hash: $TREE"; exit 1; }
          printf '%s\n' "$TREE" >verified-tree.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-verified-${{ needs.tree.outputs.tree }}
          path: verified-tree.txt
          retention-days: 14
          if-no-files-found: error
