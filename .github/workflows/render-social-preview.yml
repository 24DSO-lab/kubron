name: Render social preview

on:
  push:
    branches: [docs/social-preview-desktop-web]
    paths:
      - "docs/images/social-preview.svg"
      - ".github/workflows/render-social-preview.yml"
  pull_request:
    branches: [refactor]
    paths:
      - "docs/images/social-preview.svg"
      - ".github/workflows/render-social-preview.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: rsvg-convert -w 1280 -h 640 docs/images/social-preview.svg -o docs/images/social-preview.png
      - name: Commit PNG
        run: |
          if git diff --quiet -- docs/images/social-preview.png; then
            echo "PNG is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/social-preview.png
          git commit -m "docs: render social preview PNG"
          git push
