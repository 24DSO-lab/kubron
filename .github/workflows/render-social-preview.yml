name: Render social preview

on:
  push:
    branches: [docs/social-preview-desktop-web]
    paths:
      - "docs/images/social-preview.svg"
      - ".github/workflows/render-social-preview.yml"
  pull_request:
    branches: [refactor]
    paths:
      - "docs/images/social-preview.svg"
      - ".github/workflows/render-social-preview.yml"

# PR workflows receive read-only permissions. Only the trusted push job may write.
permissions:
  contents: read

jobs:
  render-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the PR merge ref with read-only credentials; never push from untrusted code.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: rsvg-convert -w 1280 -h 640 docs/images/social-preview.svg -o /tmp/social-preview.png

  render-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: rsvg-convert -w 1280 -h 640 docs/images/social-preview.svg -o docs/images/social-preview.png
      - name: Commit PNG
        run: |
          if git diff --quiet -- docs/images/social-preview.png; then
            echo "PNG is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/social-preview.png
          git commit -m "docs: render social preview PNG"
          git push
