name: Nightly fuzz

# Раз в сутки каждая fuzz-цель работает несколько минут на свежем корпусе. Найденный вход сохраняется как
# артефакт: добавьте его в testdata/fuzz/<цель> рядом с тестом, и он станет обычным регрессионным тестом.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: FuzzAnalyzePod, pkg: ./internal/diagnose}
          - {target: FuzzAnalyzeEvidence, pkg: ./internal/diagnose}
          - {target: FuzzDecodeSeqCursor, pkg: ./internal/baseline}
          - {target: FuzzDecodeResultCursor, pkg: ./internal/baseline}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: ./.github/actions/linux-build-deps
      - name: Stub frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - name: Fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m ${{ matrix.pkg }}
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/*"
          if-no-files-found: ignore
