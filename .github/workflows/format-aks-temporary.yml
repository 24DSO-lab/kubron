name: Temporary AKS formatting repair

on:
  push:
    branches:
      - feat/cred-aks

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cred-aks
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/app/credbroker_test.go \
            internal/credential/providers/aks/provider.go \
            internal/credential/providers/aks/provider_test.go \
            internal/credential/service_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/app/credbroker_test.go \
            internal/credential/providers/aks/provider.go \
            internal/credential/providers/aks/provider_test.go \
            internal/credential/service_test.go
          git commit -m "style: format AKS credential implementation"
          git push origin HEAD:feat/cred-aks
