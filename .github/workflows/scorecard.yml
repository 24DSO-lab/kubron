name: Scorecard

# OpenSSF Scorecard: независимая оценка практик безопасности репозитория (защита веток, пиннинг зависимостей,
# права токенов, подписи релизов и др.). Результаты попадают во вкладку Security -> Code scanning и,
# для публичного репозитория, на https://scorecard.dev (оттуда берётся бейдж).
# Файл следует официальному шаблону ossf/scorecard-action: publish_results проверяет структуру workflow
# (без env/defaults на верхнем уровне, только разрешённые экшены), поэтому здесь нет лишних шагов.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 2"
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: results.sarif
