name: Scorecard

# OpenSSF Scorecard: независимая оценка практик безопасности репозитория (защита веток, пиннинг зависимостей,
# права токенов, подписи релизов и др.). Результаты попадают во вкладку Security -> Code scanning и,
# для публичного репозитория, на https://scorecard.dev (оттуда берётся бейдж).
# Файл следует официальному шаблону ossf/scorecard-action: publish_results проверяет структуру workflow
# (без env/defaults на верхнем уровне, только разрешённые экшены), поэтому здесь нет лишних шагов.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 2"
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
