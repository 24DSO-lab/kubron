name: Deploy donations Worker

on:
  push:
    branches: [refactor]
    paths:
      - 'docs-site/workers/donations/**'
      - 'docs-site/migrations/**'
      - 'docs-site/wrangler.donations.toml'
      - '.github/workflows/deploy-donations-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global wrangler
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DONATIONALERTS_SYNC_SECRET: ${{ secrets.DONATIONALERTS_SYNC_SECRET }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          printf "%s" "$DONATIONALERTS_SYNC_SECRET" | npx wrangler secret put DONATIONALERTS_SYNC_SECRET --config wrangler.donations.toml
          printf "%s" "$TRONGRID_API_KEY" | npx wrangler secret put TRONGRID_API_KEY --config wrangler.donations.toml
          npx wrangler deploy --config wrangler.donations.toml
