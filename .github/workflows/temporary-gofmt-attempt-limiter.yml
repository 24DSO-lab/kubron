name: Temporary gofmt for credential attempt limiter

on:
  push:
    branches: [feat/credential-attempt-limits]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/credential/attempts.go \
            internal/credential/challenge_store.go \
            internal/credential/service.go \
            internal/credential/service_test.go \
            internal/pgstore/challenges.go \
            internal/pgstore/challenges_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Go files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/credential/attempts.go internal/credential/challenge_store.go internal/credential/service.go internal/credential/service_test.go internal/pgstore/challenges.go internal/pgstore/challenges_test.go
          git commit -m "style: format credential attempt limiter"
          git push
