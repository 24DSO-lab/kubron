name: Deploy docs to Cloudflare Pages

on:
  push:
    branches:
      - refactor
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - refactor
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Test the bug report receiver
        working-directory: docs-site
        run: npm run test:relay

      - name: Build site
        working-directory: docs-site
        env:
          DOCS_BASE: /
        run: npm run docs:build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: kubron-docs
          path: docs-site/.vitepress/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/refactor' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://kubron.pages.dev/
    steps:
      # Wrangler takes the Pages Functions (functions/) from its working directory. That directory must not be docs-site:
      # wrangler-action installs Wrangler next to the nearest package.json, and docs-site pins esbuild to 0.25 for
      # VitePress, which is too old for Wrangler ("import-source" is not a valid feature name). So the Pages project
      # (the built site and the receiver) is assembled in a folder of its own.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs-site/functions
            docs-site/relay/bugreport.ts

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: kubron-docs
          path: pages/dist

      - name: Assemble the Pages project
        run: |
          mkdir -p pages/relay
          cp -r docs-site/functions pages/functions
          cp docs-site/relay/bugreport.ts pages/relay/bugreport.ts

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pages
          command: pages deploy dist --project-name=kubron --branch=refactor --commit-dirty=true
