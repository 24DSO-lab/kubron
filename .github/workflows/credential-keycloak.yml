name: Credential integration (Keycloak)

on:
  push:

    branches: [test/credential-keycloak-kind-e2e-3]

    paths:
      - "internal/credential/**"
      - "internal/idpnet/**"
      - "internal/pgstore/**"
      - "internal/app/**"
      - "internal/k8s/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/credential-keycloak.yml"
  pull_request:
    branches: [refactor]
    paths:
      - "internal/credential/**"
      - "internal/idpnet/**"
      - "internal/pgstore/**"
      - "internal/app/**"
      - "internal/k8s/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/credential-keycloak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keycloak:
    name: OIDC password, refresh, PKCE and device against Keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KUBRON_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kubron_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kubron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kubron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Keycloak with an isolated test realm
        run: |
          docker run --detach --name kubron-keycloak \
            --publish 127.0.0.1:8080:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            --volume "$PWD/internal/credential/providers/oidc/testdata/keycloak-realm.json:/opt/keycloak/data/import/kubron-realm.json:ro" \
            quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597 start-dev --import-realm

      - name: Wait for the imported realm
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/realms/kubron/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs kubron-keycloak
          exit 1

      - name: Exercise the production OIDC provider
        run: go test ./internal/credential/providers/oidc -run '^TestKeycloakPasswordAndRefresh$' -count=1 -v
        env:
          KUBRON_KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/kubron
          KUBRON_KEYCLOAK_USERNAME: kubron-e2e
          KUBRON_KEYCLOAK_PASSWORD: kubron-e2e-password

      - name: Credential and IdP network regression tests
        run: go test -timeout 5m ./internal/credential/... ./internal/idpnet/...

      - name: Repeated multi-replica refresh rotation test
        run: |
          go test -timeout 5m ./internal/credential -run '^TestTwoReplicasDoNotLoseRefreshTokenRotation$' -count=10

      - name: Application regression tests
        run: go test -timeout 5m ./internal/app/...

      - name: Kubernetes regression tests
        run: go test -timeout 5m ./internal/k8s/...

      - name: PostgreSQL credential store regression tests
        run: go test -timeout 5m ./internal/pgstore/...

      - name: Vet credential and Kubernetes packages
        run: go vet ./internal/credential/... ./internal/idpnet/... ./internal/app/... ./internal/k8s/... ./internal/pgstore/...

      - name: Keycloak logs
        if: failure()
        run: docker logs kubron-keycloak

      - name: Stop Keycloak
        if: always()
        run: docker rm --force kubron-keycloak || true

  keycloak-kind:
    name: Keycloak + kind OIDC and RBAC
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate a private CA for the OIDC issuer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oidc"
          cd "$RUNNER_TEMP/oidc"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt \
            -subj "/CN=Kubron Keycloak Integration CA" -days 2
          openssl req -newkey rsa:2048 -nodes -keyout keycloak.key -out keycloak.csr \
            -subj "/CN=keycloak"
          cat >keycloak.ext <<'EOF'
          subjectAltName=DNS:keycloak
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -in keycloak.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out keycloak.crt -days 2 -sha256 -extfile keycloak.ext
          # Keycloak runs as a non-root user and must be able to read its ephemeral TLS key.
          chmod 644 keycloak.crt keycloak.key
          sudo cp ca.crt /usr/local/share/ca-certificates/kubron-keycloak-integration-ca.crt
          sudo update-ca-certificates
          cat >"$RUNNER_TEMP/kind-oidc.yaml" <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraMounts:
            - hostPath: $RUNNER_TEMP/oidc/ca.crt
              containerPath: /etc/kubernetes/pki/oidc-ca.crt
              readOnly: true
            kubeadmConfigPatches:
            - |
              apiVersion: kubeadm.k8s.io/v1beta4
              kind: ClusterConfiguration
              apiServer:
                extraArgs:
                - name: oidc-issuer-url
                  value: https://keycloak:8443/realms/kubron
                - name: oidc-client-id
                  value: kubron-integration
                - name: oidc-username-claim
                  value: preferred_username
                - name: oidc-username-prefix
                  value: "-"
                - name: oidc-ca-file
                  value: /etc/kubernetes/pki/oidc-ca.crt
          EOF

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kubron-oidc
          config: ${{ runner.temp }}/kind-oidc.yaml

      - name: Start Keycloak on the kind network
        run: |
          docker run --detach --name kubron-keycloak --network kind --network-alias keycloak \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            --env KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/server.crt \
            --env KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/server.key \
            --env KC_HTTP_ENABLED=false \
            --env KC_HOSTNAME=https://keycloak:8443 \
            --volume "$RUNNER_TEMP/oidc/keycloak.crt:/opt/keycloak/conf/server.crt:ro" \
            --volume "$RUNNER_TEMP/oidc/keycloak.key:/opt/keycloak/conf/server.key:ro" \
            --volume "$PWD/internal/credential/providers/oidc/testdata/keycloak-realm.json:/opt/keycloak/data/import/kubron-realm.json:ro" \
            quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597 \
            start-dev --https-port=8443 --import-realm
          keycloak_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' kubron-keycloak)"
          echo "$keycloak_ip keycloak" | sudo tee -a /etc/hosts

      - name: Wait for the HTTPS issuer
        run: |
          for attempt in $(seq 1 60); do
            discovery="$(curl --connect-timeout 2 --max-time 5 --cacert "$RUNNER_TEMP/oidc/ca.crt" \
              --fail --silent https://keycloak:8443/realms/kubron/.well-known/openid-configuration 2>/dev/null || true)"
            if printf '%s' "$discovery" | jq -e '.issuer == "https://keycloak:8443/realms/kubron"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker inspect kubron-keycloak
          docker logs kubron-keycloak
          curl --connect-timeout 2 --max-time 5 --cacert "$RUNNER_TEMP/oidc/ca.crt" -v \
            https://keycloak:8443/realms/kubron/.well-known/openid-configuration || true
          exit 1

      - name: Configure isolated Kubernetes RBAC
        run: |
          kubectl create namespace alice-ops
          kubectl create namespace bob-ops
          kubectl -n alice-ops create role pod-reader --verb=get,list --resource=pods
          kubectl -n alice-ops create rolebinding alice-reader --role=pod-reader --user=alice
          kubectl -n bob-ops create role pod-reader --verb=get,list --resource=pods
          kubectl -n bob-ops create rolebinding bob-reader --role=pod-reader --user=bob
          echo "KUBRON_KEYCLOAK_KIND_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
            | base64 --decode > "$RUNNER_TEMP/kind-ca.crt"
          echo "KUBRON_KEYCLOAK_KIND_CA=$RUNNER_TEMP/kind-ca.crt" >> "$GITHUB_ENV"

      - name: Verify Keycloak authentication and Kubernetes RBAC
        run: go test ./internal/credential/providers/oidc -run '^TestKeycloak(PasswordAndRefresh|KindRBAC)$' -count=1 -v
        env:
          KUBRON_KEYCLOAK_ISSUER: https://keycloak:8443/realms/kubron
          KUBRON_KEYCLOAK_USERNAME: kubron-e2e
          KUBRON_KEYCLOAK_PASSWORD: kubron-e2e-password
          KUBRON_KEYCLOAK_ALICE_PASSWORD: alice-e2e-password
          KUBRON_KEYCLOAK_BOB_PASSWORD: bob-e2e-password

      - name: Keycloak and kind diagnostics
        if: failure()
        run: |
          docker logs kubron-keycloak || true
          kubectl get --raw=/readyz?verbose || true
          kubectl -n kube-system logs kube-apiserver-kubron-oidc-control-plane --tail=250 || true
          kubectl -n kube-system describe pod kube-apiserver-kubron-oidc-control-plane || true
          docker exec kubron-oidc-control-plane sh -c 'cat /etc/kubernetes/manifests/kube-apiserver.yaml' || true

      - name: Stop Keycloak
        if: always()
        run: docker rm --force kubron-keycloak || true
