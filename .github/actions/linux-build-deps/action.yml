name: Linux build dependencies
description: >
  Системные библиотеки GTK и WebKit, с которыми линкуется Wails на Linux
  (webkit2gtk 4.1, тег сборки webkit2_41). Нужны go vet, build, test, lint и
  CodeQL, потому что корневой пакет импортирует Wails-runtime.

  Установка устойчива к сбоям зеркала Ubuntu. Раньше `apt-get install` без таймаута
  мог часами ждать медленное зеркало (~150 пакетов из-за libgtk-3-dev), и job падал только
  по таймауту всего job'а (15 минут), а вместе с ним и весь релиз. Теперь:
   - скачивание (--download-only) идёт с таймаутом и тремя попытками; на последней
     зеркало azure.archive.ubuntu.com заменяется на archive.ubuntu.com. Прерывание скачивания безопасно:
     dpkg ещё не запускался;
   - сами пакеты кэшируются (~/apt-archives, ключ по версии образа раннера): при попадании в кэш
     зеркало не нужно вовсе. Подлинность .deb проверяет apt по подписанному индексу, а не по кэшу;
   - установка из скачанных файлов идёт отдельным шагом без сети.

  Кэш сохраняется только на push (ветки, теги): pull_request его лишь читает, как в go-build-cache.

runs:
  using: composite
  steps:
    # restore + сохранение в post-шаге job'а
    - if: github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: apt-gtk-webkit-${{ runner.os }}-${{ env.ImageVersion }}-v1

    # только restore: pull_request ничего не сохраняет
    - if: github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: apt-gtk-webkit-${{ runner.os }}-${{ env.ImageVersion }}-v1

    - shell: bash
      run: |
        set -uo pipefail
        pkgs="libgtk-3-dev libwebkit2gtk-4.1-dev"
        archives="$HOME/apt-archives"
        mkdir -p "$archives/partial"
        # apt скачивает от имени _apt, а кэш принадлежит runner: открываем каталог на запись
        chmod -R a+rwX "$archives"
        opts=(-y --no-install-recommends
          -o "Dir::Cache::archives=$archives"
          -o APT::Keep-Downloaded-Packages=true
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30)

        # Индекс пакетов в образе раннера свежий: `apt-get update` (10–15 с) нужен, только если скачивание не удалось
        downloaded=0
        for attempt in 1 2 3; do
          limit=150; [ "$attempt" = 3 ] && limit=240
          if sudo timeout "$limit" apt-get install --download-only "${opts[@]}" $pkgs; then
            downloaded=1
            break
          fi
          echo "::warning::Скачивание пакетов, попытка $attempt из 3: ошибка или таймаут (${limit} с)"
          [ "$attempt" = 3 ] && break
          if [ "$attempt" = 2 ]; then
            # Зеркало раннера (azure.archive.ubuntu.com) бывает очень медленным: пробуем основное
            sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          fi
          sudo timeout 120 apt-get update || true
        done
        if [ "$downloaded" != 1 ]; then
          echo "::error::Не удалось скачать $pkgs за три попытки"
          exit 1
        fi

        # Все файлы уже в кэше: сеть не нужна, зависнуть нечему
        sudo apt-get install "${opts[@]}" $pkgs
        # Файлы кэша должны читаться пользователем runner при сохранении кэша
        sudo chmod -R a+rwX "$archives"
