name: Linux build dependencies
description: >
  Системные библиотеки GTK и WebKit, с которыми линкуется Wails на Linux
  (webkit2gtk 4.1, тег сборки webkit2_41). Нужны go vet, build, test, lint и
  CodeQL, потому что корневой пакет импортирует Wails-runtime.

runs:
  using: composite
  steps:
    - shell: bash
      # Индекс пакетов в образе раннера свежий: `apt-get update` (10–15 с в каждом job'е) нужен только если
      # установка не удалась из-за устаревшего индекса
      run: |
        pkgs="libgtk-3-dev libwebkit2gtk-4.1-dev"
        sudo apt-get install -y --no-install-recommends $pkgs ||
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends $pkgs; }
