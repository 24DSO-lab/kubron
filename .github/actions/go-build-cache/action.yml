name: Go build cache
description: >
  Кэш компиляции Go (~/.cache/go-build). setup-go кэширует только модули,
  поэтому без этого шага каждый job компилирует зависимости с нуля.

  У каждого job'а своя линия кэша (scope): actions/cache сохраняет запись только
  у первого завершившегося job'а на коммит, поэтому при общем ключе кэш получал
  объекты случайного (обычно самого быстрого) job'а, а `go test -race`, `go vet`
  и сборка биндингов Wails компилировали всё заново. Один scope — один писатель.

  Сохраняется кэш только на push (ветки, теги): прогоны pull_request его лишь
  читают (restore-keys находят запись базовой ветки), поэтому PR не вытесняют
  кэш основной ветки из лимита репозитория в 10 ГБ.

inputs:
  scope:
    description: >
      Линия кэша job'а (test, race, lint, pg, server, frontend, firefox, misc). Job'ы с
      одинаковой сборкой (например, сервер в e2e) могут делить один scope: их
      объекты совпадают, поэтому не важно, чей кэш сохранится.
    required: true

runs:
  using: composite
  steps:
    # restore + сохранение в post-шаге job'а
    - if: github.event_name != 'pull_request'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/go.sum') }}-
          go-build-${{ runner.os }}-${{ inputs.scope }}-

    # только restore: pull_request ничего не сохраняет
    - if: github.event_name == 'pull_request'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/go.sum') }}-
          go-build-${{ runner.os }}-${{ inputs.scope }}-
