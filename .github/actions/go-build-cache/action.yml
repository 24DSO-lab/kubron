name: Go build cache
description: >
  Кэш компиляции Go (~/.cache/go-build). setup-go кэширует только модули,
  поэтому без этого шага каждый job компилирует зависимости с нуля.
  Ключ содержит hashFiles('**/go.sum') и sha коммита; restore-keys дают
  частичное переиспользование между коммитами. Записи кэша помечены
  версией тулчейна, смена Go безопасна.

runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
          go-build-${{ runner.os }}-