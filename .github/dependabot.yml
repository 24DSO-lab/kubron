version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: refactor
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    target-branch: refactor
    schedule:
      interval: weekly
    groups:
      vue:
        patterns: ["vue", "vue-*", "@vitejs/*", "vite", "typescript"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: refactor
    schedule:
      interval: monthly
