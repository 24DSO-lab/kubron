version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: refactor
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    target-branch: refactor
    schedule:
      interval: weekly
    groups:
      vue:
        patterns: ["vue", "vue-*", "@vitejs/*", "vite"]
    open-pull-requests-limit: 5
    # TypeScript 7 (нативный) несовместим с vue-tsc (нет ./lib/tsc в exports) —
    # мажорные бампы typescript игнорируем, пока vue-tsc не поддержит TS 7
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: refactor
    schedule:
      interval: monthly
