apiVersion: v2
name: kubron
description: Kubron web server — Kubernetes management in the browser (external PostgreSQL, two or more replicas)
type: application
# 0.0.0-dev — намеренная заглушка исходников, НЕ версия релиза. Версию чарта и appVersion подставляет .github/workflows/publish.yml
# из тега vX.Y.Z (helm package --version/--app-version): один номер на десктоп, образ и чарт (docs/releasing.md).
# Править эти поля вручную при выпуске не нужно; scripts/release.sh их не трогает.
# Установка из исходников (helm install deploy/helm/kubron) без image.tag даёт образ :0.0.0-dev, которого в реестре нет:
# задайте --set image.tag=<версия> или image.digest.
version: 0.0.0-dev
appVersion: "0.0.0-dev"
kubeVersion: ">=1.27.0-0"
home: https://github.com/24DSO-labs/kubron
sources:
  - https://github.com/24DSO-labs/kubron
keywords:
  - kubernetes
  - dashboard
  - kubron
maintainers:
