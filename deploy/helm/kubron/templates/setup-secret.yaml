{{- /*
  Токен первичной настройки, который чарт создаёт сам, если не заданы secrets.keys.setupToken и setup.existingSecret.
  Значение берётся из уже существующего Secret (lookup), иначе генерируется. При «helm template» и в GitOps-системах,
  которые рендерят чарт без доступа к кластеру, lookup пуст и токен менялся бы на каждом рендере: там используйте
  setup.existingSecret. Без resource-policy keep: токен нужен только до создания первого администратора.
*/ -}}
{{- if and .Values.setup.enabled (not .Values.setup.existingSecret) (not .Values.secrets.keys.setupToken) }}
{{- $name := include "kubron.setupSecretName" . }}
{{- $key := include "kubron.setupTokenKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := randAlphaNum (int .Values.setup.tokenLength) }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $token = index $existing.data $key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubron.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc | quote }}
{{- end }}
