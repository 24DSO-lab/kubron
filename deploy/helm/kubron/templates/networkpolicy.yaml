{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubron.fullname" . }}
  labels:
    {{- include "kubron.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubron.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    # Метрики: только из namespace мониторинга, не из namespace ingress
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.egress.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # PostgreSQL
    - ports:
        {{- range .Values.networkPolicy.egress.postgres.ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      {{- with (include "kubron.egressTo" (dict "target" .Values.networkPolicy.egress.postgres "open" false)) }}
      to:
        {{- . | nindent 8 }}
      {{- end }}
    # API-серверы кластеров. По умолчанию любые адреса, кроме link-local и метаданных облака (SSRF): см. values.yaml
    - ports:
        {{- range .Values.networkPolicy.egress.clusterApi.ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      to:
        {{- include "kubron.egressTo" (dict "target" .Values.networkPolicy.egress.clusterApi "open" true) | nindent 8 }}
    {{- if .Values.networkPolicy.egress.idp.ports }}
    # Провайдеры OIDC на нестандартных портах (oidc-password); порт 443 входит в правило API-серверов
    - ports:
        {{- range .Values.networkPolicy.egress.idp.ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      to:
        {{- $idp := dict "to" .Values.networkPolicy.egress.idp.to "cidrs" .Values.networkPolicy.egress.idp.cidrs "except" .Values.networkPolicy.egress.clusterApi.except "allowCluster" false }}
        {{- include "kubron.egressTo" (dict "target" $idp "open" true) | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
