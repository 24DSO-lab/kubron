{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubron.fullname" . }}
  labels:
    {{- include "kubron.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "kubron.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
    {{- with .Values.portForward.baseDomain }}
    # Потоки port-forward: {id}.pf.<домен> обслуживает тот же сервис, хост выбирает сам сервер (ADR-0017)
    - host: {{ printf "*.pf.%s" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubron.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
