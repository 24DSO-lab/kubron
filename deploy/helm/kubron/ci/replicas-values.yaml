# Две реплики: рендерится PodDisruptionBudget и правила размещения по узлам
secrets:
  existingSecret: kubron-secrets
replicaCount: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: kubron
